<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — SLP School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F14;
    --bg-raised: #121821;
    --bubble-user: #17202B;
    --line: #1E2833;
    --text: #EDEFF2;
    --text-dim: #8A97A6;
    --green: #3ECF8E;
    --green-dim: rgba(62,207,142,0.14);
    --amber: #E2A03E;
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    border-bottom:1px solid var(--line);
    padding: 16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .back{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back:hover{ color: var(--text); }
  .level-tag{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    letter-spacing: .08em;
  }
  h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 20px;
    margin-top: 2px;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding: 24px;
  }
  .chat{
    max-width: 680px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .msg{
    max-width: 90%;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.assistant{
    align-self: flex-start;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 14px 16px;
    border-radius: 10px 10px 10px 2px;
  }
  .msg.user{
    align-self: flex-end;
    background: var(--green-dim);
    border: 1px solid rgba(62,207,142,0.3);
    padding: 14px 16px;
    border-radius: 10px 10px 2px 10px;
    color: var(--text);
  }
  .msg.typing{
    align-self: flex-start;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    padding: 14px 16px;
  }
  .locked-notice{
    max-width: 680px;
    margin: 60px auto;
    text-align:center;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    border-radius: 10px;
    padding: 40px 28px;
  }
  .locked-notice .icon{ font-size: 28px; margin-bottom: 14px; }
  .locked-notice h2{ font-family: var(--serif); font-size: 22px; margin-bottom: 10px; }
  .locked-notice p{ color: var(--text-dim); font-size: 14.5px; max-width: 44ch; margin: 0 auto 22px; }
  .unlock-btn{
    background: var(--green);
    color: #06110C;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 4px;
    display:inline-block;
    border: none;
    cursor: pointer;
  }

  footer{
    border-top:1px solid var(--line);
    padding: 16px 24px 20px;
  }
  .input-row{
    max-width: 680px;
    margin: 0 auto;
    display:flex;
    gap: 10px;
  }
  textarea{
    flex:1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    padding: 12px 14px;
    resize: none;
    height: 48px;
    max-height: 140px;
  }
  textarea:focus{ outline: none; border-color: var(--green); }
  textarea::placeholder{ color: var(--text-dim); }
  button.send{
    background: var(--green);
    color: #06110C;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button.send:disabled{
    opacity: 0.5;
    cursor: not-allowed;
  }
  .hint{
    max-width: 680px;
    margin: 8px auto 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">&larr; All levels</a>
  <div style="text-align:right">
    <div class="level-tag" id="levelTag">LEVEL —</div>
    <h1 id="levelTitle">Loading…</h1>
  </div>
</header>

<main>
  <div class="chat" id="chat"></div>
  <div id="lockedArea"></div>
</main>

<footer id="footerArea">
  <div class="input-row">
    <textarea id="input" placeholder="Ask a question about this lesson…" rows="1"></textarea>
    <button class="send" id="sendBtn">Send</button>
  </div>
  <div class="hint">The AI only teaches this level's material — ask anything about it.</div>
</footer>

<script>
  const LEVELS = {
    1: { title: "What Moves Price", locked: false },
    2: { title: "Reading Trend & Structure Shifts", locked: false },
    3: { title: "Candles With Intent", locked: false },
    4: { title: "Entries, Confirmation & Timing", locked: true },
    5: { title: "The SLP Framework", locked: true },
    6: { title: "Applying SLP Live", locked: true },
    7: { title: "Trading SLP On Your Own", locked: true },
  };

  const params = new URLSearchParams(window.location.search);
  const level = parseInt(params.get('level') || '1', 10);
  const levelInfo = LEVELS[level] || LEVELS[1];

  // TEMPORARY: for testing before real payments are wired up, an unlocked
  // level can be simulated by adding &test_unlock=1 to the URL.
  const testUnlock = params.get('test_unlock') === '1';
  const isUnlocked = !levelInfo.locked || testUnlock;

  document.getElementById('levelTag').textContent = `LEVEL ${String(level).padStart(2,'0')}`;
  document.getElementById('levelTitle').textContent = levelInfo.title;

  const chatEl = document.getElementById('chat');
  const lockedArea = document.getElementById('lockedArea');
  const footerArea = document.getElementById('footerArea');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];

  if (!isUnlocked) {
    footerArea.style.display = 'none';
    lockedArea.innerHTML = `
      <div class="locked-notice">
        <div class="icon">🔒</div>
        <h2>This level is part of the paid track</h2>
        <p>Levels 4–7 unlock with an SLP School subscription ($40/mo) — that's where entries, timing, and the full SLP strategy live.</p>
        <button class="unlock-btn" id="upgradeBtn">Upgrade to unlock</button>
      </div>
    `;
    document.getElementById('upgradeBtn').addEventListener('click', () => {
      alert('Payments aren\'t wired up yet — this is where Stripe checkout will go.');
    });
  } else {
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    // Kick off the lesson automatically with an opening message.
    sendMessage("Let's start this lesson.", true);
  }

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  async function sendMessage(forcedText, isOpening) {
    const text = forcedText || inputEl.value.trim();
    if (!text) return;

    if (!isOpening) {
      addBubble('user', text);
    }
    inputEl.value = '';
    inputEl.style.height = '48px';
    sendBtn.disabled = true;

    const typingEl = document.createElement('div');
    typingEl.className = 'msg typing';
    typingEl.textContent = 'thinking…';
    chatEl.appendChild(typingEl);
    typingEl.scrollIntoView({ behavior: 'smooth', block: 'end' });

    try {
      const res = await fetch('/.netlify/functions/tutor', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          level: level,
          message: text,
          history: history,
          unlocked: isUnlocked,
        }),
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addBubble('assistant', 'Something went wrong: ' + (data.error || 'unknown error'));
        sendBtn.disabled = false;
        return;
      }

      addBubble('assistant', data.reply);
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      typingEl.remove();
      addBubble('assistant', 'Connection error — try again.');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>

</body>
</html>
